set timeout=0
set default=0
terminal_input console
terminal_output console

menuentry "QAR-OS" {
    multiboot2 /boot/qaros.elf
    module2 /apps/hello.qar hello.qar
    module2 /apps/ticker_a.qar ticker_a.qar
    module2 /apps/ticker_b.qar ticker_b.qar
    module2 /apps/crash.qar crash.qar
    module2 /apps/netdemo.qar netdemo.qar
    module2 /apps/tampered.qar tampered.qar
    module2 /apps/untrusted.qar untrusted.qar
    boot
}
